name: SimpleWx
options:
  bundleIdPrefix: org.flightblog
  deploymentTarget:
    iOS: "17.0"
targets:
  SimpleWx:
    type: application
    platform: iOS
    sources: [SimpleWx]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.flightblog.SimpleWx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
